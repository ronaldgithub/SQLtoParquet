name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SQLtoParquet.sln

      - name: Test
        run: dotnet test SQLtoParquet.sln -c Release --no-restore

      - name: Publish App
        run: >
          dotnet publish src/SQLtoParquet.App/SQLtoParquet.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish/app-win-x64

      - name: Strip debug symbols
        shell: pwsh
        run: Remove-Item publish/app-win-x64/*.pdb -ErrorAction SilentlyContinue

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/app-win-x64/* -DestinationPath SQLtoParquet-${{ github.ref_name }}-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: SQLtoParquet-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true

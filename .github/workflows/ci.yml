name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # global.json pins the SDK to 8.0.206 but rolls forward to the newest installed major
          # version — Avalonia's XAML source generator needs a newer Roslyn than the 8.0.x SDK ships.
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SQLtoParquet.sln

      - name: Build
        run: dotnet build SQLtoParquet.sln -c Release --no-restore

      - name: Test
        run: dotnet test SQLtoParquet.sln -c Release --no-build
